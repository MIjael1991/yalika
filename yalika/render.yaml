services:
  - type: web
    name: plataforma-encuestas-piloto
    runtime: node
    plan: free
    buildCommand: cd apps/api && npm ci && npx prisma migrate deploy && npm run build && cd ../web && npm ci && npm run build
    startCommand: node infrastructure/render/start-platform.mjs
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SURVEY_PII_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_SURVEY_MODEL
        value: gpt-5-mini
      - key: ORION_SESSION_HOURS
        value: 12
      - key: ORION_BOOTSTRAP_ORGANIZATION
        sync: false
      - key: ORION_BOOTSTRAP_NAME
        sync: false
      - key: ORION_BOOTSTRAP_EMAIL
        sync: false
      - key: ORION_BOOTSTRAP_PASSWORD
        sync: false
